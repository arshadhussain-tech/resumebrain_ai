<div class="auth-page">


  <div class="auth-brand">
    <div class="brand-icon" aria-hidden="true">
      <svg viewBox="0 0 48 48" width="28" height="28" fill="none" xmlns="http://www.w3.org/2000/svg">

        <path d="M11 5H28L37 14V42H11V5Z" stroke="white" stroke-width="2.5" stroke-linejoin="round" />

        <path d="M28 5V14H37" stroke="white" stroke-width="2.5" stroke-linejoin="round" />

        <path d="M17 27L22 32L31 22" stroke="#67E8F9" stroke-width="3.5" stroke-linecap="round"
          stroke-linejoin="round" />

        <path d="M18 16H23" stroke="white" stroke-width="2" stroke-linecap="round" />
      </svg>
    </div>

    <div class="auth-brand-text">
      <strong>Resume<span>Brain</span></strong>
      <small>AI Resume Intelligence</small>
    </div>
  </div>

  <div class="auth-container">

    <section class="auth-card">

      <div class="auth-header">

        <h1>Welcome back</h1>

        <p>
          Sign in to continue to ResumeBrain.
        </p>

      </div>


      <form (ngSubmit)="login()">

        <div class="form-group">

          <label>
            Email address
          </label>

          <input type="email" name="email" [(ngModel)]="email" placeholder="name@example.com" />

        </div>


        <div class="form-group">

          <div class="password-label">

            <label>
              Password
            </label>

            <a href="#">
              Forgot password?
            </a>

          </div>

          <div class="password-input">

            <input [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="password"
              placeholder="Enter your password" />

            <button type="button" (click)="togglePassword()">

              {{ showPassword ? 'Hide' : 'Show' }}

            </button>

          </div>

        </div>


        <label class="remember">

          <input type="checkbox" name="rememberMe" [(ngModel)]="rememberMe" />

          <span>
            Remember me
          </span>

        </label>


        <button type="submit" class="login-button">

          Sign In

        </button>

      </form>


      <div class="divider">
        <span>or</span>
      </div>


      <div class="signup-link">

        Don't have an account?

        <a routerLink="/register">
          Create an account
        </a>

      </div>

    </section>


    <div class="auth-footer">

      <span>
        © 2026 ResumeBrain
      </span>

      <span>•</span>

      <span>
        AI-powered resume matching
      </span>

    </div>

  </div>

</div>
