<div class="app-container">

  <app-navbar
    (menuToggle)="toggleSidebar()">
  </app-navbar>

  <div class="app-body">

    <app-sidebar
      [isOpen]="isSidebarOpen"
      (closeSidebar)="closeSidebar()">
    </app-sidebar>

    <div
      class="sidebar-overlay"
      [class.visible]="isSidebarOpen"
      (click)="closeSidebar()">
    </div>

    <main class="main-content">
      <router-outlet></router-outlet>
    </main>

  </div>

</div>
